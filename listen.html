<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>GONG HEI — VIP Listening Room</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#fbe3a1; --gold2:#d4af37; --crim:#2b0006; --crim2:#4a000e; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; color:#f3f4f6; font-family:'Inter',sans-serif;
    background: radial-gradient(circle at 50% 30%, #b80c29 0%, #2b0006 75%);
  }
  .card {
    width:100%; max-width:440px; text-align:center; padding:32px 24px; border-radius:24px;
    background:linear-gradient(135deg, rgba(74,0,14,.9), rgba(43,0,6,.95));
    border:1px solid rgba(212,175,55,.55); box-shadow:0 20px 50px rgba(0,0,0,.7);
  }
  h1 { font-family:'Cinzel',serif; font-weight:900; letter-spacing:.15em; color:var(--gold); margin:0 0 4px; font-size:30px; }
  .sub { font-size:12px; letter-spacing:.25em; color:var(--gold2); text-transform:uppercase; margin-bottom:22px; }
  .badge { display:inline-block; padding:4px 14px; border:1px solid var(--gold2); border-radius:999px; font-size:12px; color:var(--gold); margin-bottom:18px; }
  p { font-size:14px; line-height:1.6; color:#e5e7eb; margin:10px 0; }
  .warn { font-size:12px; color:var(--gold); background:rgba(212,175,55,.1); border-radius:12px; padding:10px 14px; }
  button {
    width:100%; margin-top:18px; padding:15px; border:0; border-radius:12px; cursor:pointer;
    font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px;
    background:linear-gradient(90deg,#fbe3a1,#d4af37,#996515); color:var(--crim);
  }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height:8px; background:var(--crim); border:1px solid rgba(212,175,55,.3); border-radius:99px; overflow:hidden; margin-top:20px; cursor:pointer; }
  .bar > div { height:100%; width:0; background:linear-gradient(90deg,#996515,#fbe3a1); }
  .time { display:flex; justify-content:space-between; font-size:11px; color:#c9b27a; margin-top:6px; font-family:monospace; }
  .hidden { display:none; }
  .wm { margin-top:18px; font-size:10px; color:rgba(251,227,161,.45); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="card">
  <h1>GONG HEI</h1>
  <div class="sub">CNY SONG 2027 羊年吉祥 | 恭喜 · VIP Room</div>

  <div id="vLoading"><p>Memeriksa akses VIP kamu…</p></div>

  <div id="vReady" class="hidden">
    <span class="badge" id="slotBadge"></span>
    <p>Kamu akan mendengarkan <b>full instrument</b> lagu Gong Hei sebelum rilis resmi.</p>
    <p class="warn">Link ini hanya bisa dibuka <b>satu kali</b>. Pastikan koneksi stabil, jangan tutup halaman sampai selesai, dan jangan di-refresh.</p>
    <button id="startBtn">Mulai Dengarkan</button>
  </div>

  <div id="vPlay" class="hidden">
    <span class="badge" id="slotBadge2"></span>
    <p id="nowTitle">Sedang diputar…</p>
    <button id="ppBtn">Pause</button>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <audio id="audio" preload="auto" controlsList="nodownload noplaybackrate" disablePictureInPicture></audio>
  </div>

  <div id="vEnd" class="hidden"><p id="endMsg"></p></div>

  <div class="wm" id="wm"></div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxqqzKgL04KoGy4_vYT_kMA6CQ70UTUPicX9IHKdo69XjuzkjHcEpjv0ygTPtthPBo/exec';

  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';
  let slot = '';
  let started = false;

  // jangan simpan token di riwayat / referer
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  function show(id) {
    ['vLoading','vReady','vPlay','vEnd'].forEach(v => $(v).classList.add('hidden'));
    $(id).classList.remove('hidden');
  }
  function end(msg) { $('endMsg').innerHTML = msg; show('vEnd'); }
  const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
  const pad = n => ('0' + n).slice(-2);

  async function api(params) {
    const res = await fetch(GAS_URL + '?' + new URLSearchParams(params));
    return res.json();
  }

  async function init() {
    if (!token) return end('Link tidak valid.');
    try {
      const r = await api({ action: 'check', t: token });
      if (!r.ok) {
        return end(r.reason === 'used'
          ? 'Link ini sudah digunakan.<br>Terima kasih sudah jadi bagian dari VIP untuk lagu GONG HEI 2027 🧧'
          : 'Link tidak valid atau sudah kedaluwarsa.');
      }
      slot = pad(r.slot);
      $('slotBadge').textContent = 'VIP No. ' + slot + ' / 30';
      $('slotBadge2').textContent = 'VIP No. ' + slot + ' / 30';
      $('wm').textContent = 'VIP-' + slot + ' · PRIVATE LISTENING · DO NOT SHARE';
      show('vReady');
    } catch (e) {
      end('Gagal terhubung ke server. Coba muat ulang halaman.');
    }
  }

  $('startBtn').onclick = async () => {
    if (started) return;
    started = true;
    $('startBtn').disabled = true;
    $('startBtn').textContent = 'Menyiapkan…';
    try {
      const r = await api({ action: 'play', t: token });
      if (!r.ok) {
        return end(r.reason === 'used'
          ? 'Link ini sudah digunakan.'
          : r.reason === 'server'
            ? 'Server sedang bermasalah. Link kamu belum terpakai, coba lagi nanti ya.'
            : 'Link tidak valid.');
      }
      const a = $('audio');
      a.src = r.url;
      show('vPlay');
      await a.play();
    } catch (e) {
      end('Gagal memutar audio. Hubungi Artist untuk bantuan.');
    }
  };

  const a = $('audio');
  a.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  a.addEventListener('loadedmetadata', () => $('dur').textContent = fmt(a.duration));
  a.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(a.currentTime);
    $('fill').style.width = (a.currentTime / a.duration * 100 || 0) + '%';
  });
  a.addEventListener('ended', () => {
    a.removeAttribute('src'); a.load();
    end('Terima kasih sudah mendengarkan! Semoga kamu suka mendengarnya 🧧<br>Link ini sudah tidak bisa dibuka lagi.<br><br>Sampai jumpa di pengumuman resmi lagu GONG HEI 2027 yang akan segera di rilis nanti.');
  });
  $('ppBtn').onclick = () => {
    if (a.paused) { a.play(); $('ppBtn').textContent = 'Pause'; }
    else { a.pause(); $('ppBtn').textContent = 'Lanjutkan'; }
  };
  $('bar').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration;
  };

  init();
</script>
</body>
</html>
